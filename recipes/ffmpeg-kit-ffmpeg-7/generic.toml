# FFmpeg for ffmpeg-kit-next. The same upstream release this tree's ffmpeg-7
# takes (see retrolunar2-packages/ffmpeg-7/source.toml), so configure_args
# below are that recipe's set - plus the patches ffmpeg-kit applies to its own
# FFmpeg checkout, scripts/android/ffmpeg.sh:411-435, applied here instead, and
# plus the two things the kit's build needs out of the install that a stock
# FFmpeg install does not carry: config.h and the fftools/ headers.
deps = ["zlib", "bzip2", "xz", "opus", "libvpx", "lame", "ffmpeg-kit-ffmpeg-7@source", "ffmpeg-kit-next-7@source"]
buildsystem = "autoconf"

# ffmpeg-kit-next-7@source is here for tools/protocols/*.inc. The driver copies
# every @source dependency into the same work directory (emit_sources), and the
# kit's tools/ would then merge with the FFmpeg release's tools/, so sources =
# false and pre lays the two copies out itself: the FFmpeg release at the top,
# which is where ./configure has to be, and the kit under .kit/.
sources = false

# ffmpeg's configure is hand-written (libav-style) and ignores
# $CFLAGS/$LDFLAGS, so the system's flags go in explicitly.
configure_args = ["--prefix=$OUTPKG", "--cc=$CC", "--cxx=$CXX", "--ar=$AR", "--ranlib=$RANLIB", "--strip=$STRIP", "--pkg-config-flags=--static", "--enable-static", "--enable-shared", "--disable-doc", "--disable-programs", "--disable-network", "--disable-iconv", "--disable-libxcb", "--enable-zlib", "--enable-bzlib", "--enable-lzma", "--enable-libopus", "--enable-libvpx", "--enable-libmp3lame", "--enable-pic", "--enable-jni"]

pre = """
# The FFmpeg release, and, beside it, the kit's source for tools/protocols.
# (`cp -rf <dir>/. <dst>` copies the directory's contents; `<dir>` alone would
# copy the nest's symlink.)
cp -rf $NESTDIR/ffmpeg-kit-ffmpeg-7@source/. .
mkdir -p .kit
cp -rf $NESTDIR/ffmpeg-kit-next-7@source/. .kit/

# ffmpeg's configure is hand-written (libav family) and knows no --host/--build:
# the driver's $AUTOCONF_CONFIGURE_FLAGS carries both for the autotools
# packages, and ffmpeg stops at the first of them with
#   Unknown option "--host=aarch64-linux-android".
# See ./configure --help for available options.
# So the driver's flags are trimmed to the install prefix, which ffmpeg does
# take; the toolchain arrives through --cc/--cxx/--ar/--ranlib/--strip above.
AUTOCONF_CONFIGURE_FLAGS="--prefix=$OUTPKG"

# The driver expands a list field unquoted, so an element holding spaces reaches
# configure as several arguments and ffmpeg rejects the second word -
#   Unknown option "-fPIC".
# See ./configure --help for available options.
# (that was --extra-cflags=$CFLAGS: the system's CFLAGS is several words).
# --extra-cflags is one of the few options ffmpeg *appends* - its name sits in
# the parser's CMDLINE_APPEND list - so the flags are handed over one token at a
# time and add up to exactly what the system set.
#
# There is no equivalent for the linker: --extra-ldflags is advertised in
# ffmpeg's help, but the name appears nowhere in configure's CMDLINE_SET or
# CMDLINE_APPEND lists, so passing it is the same trap one word later
#   Unknown option "--extra-ldflags=..."
# The linker flags are therefore left to ffmpeg's own target rules - a
# static-only build of ours links no program - and the dependencies are found
# through pkg-config, whose search path the closure sets
# (--pkg-config-flags=--static above). CFLAGS is what the build genuinely needs:
# -O2 and -fPIC, which the system's CFLAGS carries and $CPPFLAGS does not.
for _f in $CFLAGS; do
  BS_configure_args="$BS_configure_args --extra-cflags=$_f"
done
unset _f

# ffmpeg-kit's own patches to FFmpeg, verbatim from scripts/android/ffmpeg.sh:411-435
# (their `git checkout libavformat/file.c hls.c protocols.c libavutil` only undoes
# a previous run's patching; the release tarball is pristine, so it is left out).
# This tag (v7.1.0) sed's the release's own declaration: ffmpeg.sh:420 is
#   ${SED_INLINE} 's/static int av_log_level/__thread int av_log_level/g' .../log.c
# and 7.1.5 has exactly `static int av_log_level = AV_LOG_INFO;` (libavutil/log.c:56).
# The `static atomic_int` form the later tags sed arrives with 8.1.3, the FFmpeg
# those tags build - it is not this release's line.
sed -i 's/static int av_log_level/__thread int av_log_level/g' libavutil/log.c

# 2. The ffmpeg-kit protocols: ffkitsaf (Storage Access Framework), ffkitmem and
# ffkitstream (in-memory and streaming I/O). Under this tag (v7.1.0) the four
# files are plain .c/.h under tools/protocols (ffmpeg.sh:426-429); the .inc names
# belong to the later tags. They define the URLProtocol objects and add them to
# file.c's own protocol; the awk declares them in
# libavformat/protocols.c, which is what puts them in the protocol list at all -
# configure builds $PROTOCOL_LIST by scanning that file for
# `extern ... ff_X_protocol;` lines (find_things_extern in configure) and then
# enables every name it finds, so an added extern is an enabled protocol.
cat .kit/tools/protocols/libavformat_file.c >> libavformat/file.c
cat .kit/tools/protocols/libavformat_ffkitmem_stream.c >> libavformat/file.c
cat .kit/tools/protocols/libavutil_file.h >> libavutil/file.h
cat .kit/tools/protocols/libavutil_file.c >> libavutil/file.c
awk '{gsub(/ff_file_protocol;/,"ff_file_protocol;\\nextern const URLProtocol ff_ffkitsaf_protocol;\\nextern const URLProtocol ff_ffkitmem_protocol;\\nextern const URLProtocol ff_ffkitstream_protocol;")}1' libavformat/protocols.c > libavformat/protocols.c.tmp
cat libavformat/protocols.c.tmp > libavformat/protocols.c
rm -f libavformat/protocols.c.tmp
# Byte-for-byte the kit's own line: the shell has to see the backslash before
# each quote and each pipe, so the TOML carries them escaped one more time.
sed -i "s|av_strstart(proto_name, \\\"file\\\", NULL))|av_strstart(proto_name, \\\"file\\\", NULL) \\|\\| av_strstart(proto_name, \\\"ffkitsaf\\\", NULL) \\|\\| av_strstart(proto_name, \\\"ffkitmem\\\", NULL) \\|\\| av_strstart(proto_name, \\\"ffkitstream\\\", NULL))|g" libavformat/hls.c
"""

post = """
# What the wrapper compiles against, out of the install. ffmpeg-kit's own
# ffmpeg.sh does exactly this after `make install` (ffmpeg.sh:527-531: config.h
# is copied in and the source tree's headers are mirrored over the installed
# ones), and with SKIP_ffmpeg=1 none of it runs in its build:
#   android/ffmpeg-kit-next-android-lib/src/main/cpp/ffmpegkit.c:31  #include "config.h"
#   .../fftools/ffmpeg.h:106                                         #include "config.h"
#   android/jni/Android.mk:        FFMPEG_INCLUDES := .../prebuilt/$(MY_BUILD_DIR)/ffmpeg/include
#   android/jni/ffmpeg/Android.mk: LOCAL_EXPORT_C_INCLUDES := $(LOCAL_PATH)/../include
# so both have to land under include/ of what this package hands over: the
# wrapper is not patched, it is given the headers it asks for.
#
# fftools/ rides along in the mirror and that is where it has to be:
# `#include "fftools/ffmpeg.h"` is resolved against .../ffmpeg/include
# (FFMPEG_INCLUDES for ffmpegkit_abidetect, and libavutil's exported includes for
# the module that builds the kit's own fftools/ copies), so a top-level
# $PREFIX/fftools would never be looked at. $PREFIX/include/fftools/ is what
# their own build produces as well.
#
# -not -path './.kit/*' keeps the kit copy out of the mirror: it is here for
# four files under tools/protocols/, and its own .h files are not headers of
# this install.
mkdir -p "$PREFIX/include"
cp config.h "$PREFIX/include/config.h"
find . -name '*.h' -not -path './.kit/*' -exec cp --parents -t "$PREFIX/include/" {} +
"""

# The driver's fields are asserted rather than left to their defaults: the
# emitted script reads BS_make as ${BS_make:-} in every node's block, so a field
# this recipe does not define is whatever the node before it left behind, and
# lame builds in post with make = false / install = false. That node is the one
# before this one in the closure, so without the lines below ffmpeg had both
# steps skipped in silence: nothing was staged and the entry's relax step
# reported
#   sh: line 50: <stage>/.../store/<hash>/../.relax-list: No such file or directory
# targets, make_args and install_args are cleared for the same reason - the
# previous node's value would arrive as this one's arguments.
make = true
install = true
targets = ""
make_args = ""
install_args = ""
