deps = ["shine@source"]
buildsystem = "autoconf"
# libshine.a, its header layer3.h under include/shine and shine.pc.
#
# Makefile.am builds three things: libshine.la (line 10), the shineenc program
# (line 20) and the shine.pc pkg-config file (line 26). Nothing guards shineenc
# with an option, so it is compiled and linked - it is a target binary nothing
# here can run, which a cross build allows (it is built, not run). shine has no
# external dependencies at all, so libshine_la_LDFLAGS needs only -lm (line 16),
# which the Android system already carries.
#
# No patch is needed on the release tarball, and that is worth stating because
# ffmpeg-kit's own scripts/android/shine.sh patches src/lib/l3mdct.h:
#   void shine_mdct_initialise();                      (l3mdct.h:4)
#   void shine_mdct_initialise(shine_global_config *config)   (l3mdct.c:33)
# The two disagree - an unprototyped declaration, legal up to C17, a conflicting
# type in C23, where the empty list means (void). Their build hits it because it
# runs autoreconf with autoconf 2.72, which probes the compiler and bakes
# -std=gnu23 into CC. The tarball's own configure was generated by autoconf 2.69
# and selects no such standard (it contains no gnu23 at all), so the conflict
# never becomes an error here and nothing is patched. Should this recipe ever
# move to a git checkout plus autoreconf, the patch becomes necessary again.
#
# --enable-static --with-pic --disable-shared: a target prefix has no loader path
# for a versioned object, so static only, and the archive is position-independent
# because it is meant to be linked into shared libraries later.
configure_args = ["--enable-static", "--disable-shared", "--with-pic"]

# The driver's fields are asserted rather than left to their defaults: the
# emitted block reads BS_make="${BS_make:-}" for any field a recipe does not
# define, and a generated script builds every node in one process, so a node
# inherits whatever the node before it left behind. A sibling recipe in this tree
# (openh264, whose own post does its building) sets make = false / install =
# false, and a package that followed it in one script would otherwise skip its
# build and install steps in silence and publish an empty directory while
# exiting 0.
make = true
install = true
targets = ""
make_args = ""
install_args = ""
