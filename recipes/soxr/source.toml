# soxr 0.1.3 - the SoX resampler library, from upstream's own repository. The
# project publishes no release tarball, only git tags, so the source is the
# codeload archive of the tag; 0.1.3 is the newest tag there is.
#
# The GitHub tag archive carries one leading directory (soxr-0.1.3/) and unpacks
# with --strip-components=1. It is a plain source drop, so it has no CMakeLists
# generated for it - the ones in the archive are upstream's own.
version = "0.1.3"

build = """
mkdir -p dl
if [ ! -f dl/soxr.tar.gz ]; then
  curl -fSL -C - -o dl/soxr.tar.gz "https://codeload.github.com/chirlu/soxr/tar.gz/refs/tags/0.1.3"
fi
rm -rf src
mkdir -p src
tar -xzf dl/soxr.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
