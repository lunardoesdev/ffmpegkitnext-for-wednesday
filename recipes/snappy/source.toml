# snappy 1.2.2 - Google's fast compressor. The source is the tag archive of
# upstream's own repository; 1.2.2 is what ffmpeg-kit pins (upstream has since
# tagged 1.3.0/1.3.1, which this tree does not need).
#
# The GitHub archive carries one leading directory (snappy-1.2.2/) and unpacks
# with --strip-components=1.
version = "1.2.2"

build = """
mkdir -p dl
if [ ! -f dl/snappy.tar.gz ]; then
  curl -fSL -C - -o dl/snappy.tar.gz "https://github.com/google/snappy/archive/refs/tags/1.2.2.tar.gz"
fi
rm -rf src
mkdir -p src
tar -xzf dl/snappy.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
