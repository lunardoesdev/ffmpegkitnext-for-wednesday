# vo-amrwbenc 0.1.3 - the VisualOn AMR-WB encoder library, from the
# opencore-amr SourceForge project that hosts this release. 0.1.3 is the newest
# release there and the version ffmpeg-kit pins.
#
# The release tarball ships a generated ./configure with aclocal.m4 and every
# Makefile.in, so nothing here has to run autotools. It carries one leading
# directory (vo-amrwbenc-0.1.3/) and unpacks with --strip-components=1.
version = "0.1.3"

build = """
mkdir -p dl
if [ ! -f dl/vo-amrwbenc.tar.gz ]; then
  curl -fSL -C - -o dl/vo-amrwbenc.tar.gz "https://downloads.sourceforge.net/project/opencore-amr/vo-amrwbenc/vo-amrwbenc-0.1.3.tar.gz"
fi
rm -rf src
mkdir -p src
tar -xzf dl/vo-amrwbenc.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
