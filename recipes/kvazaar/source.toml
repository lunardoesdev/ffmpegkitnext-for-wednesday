# kvazaar 2.3.2 - the open-source HEVC (H.265) encoder library. Upstream tags as
# v<major>.<minor>.<patch> and the GitHub archive of the tag carries one leading
# directory (kvazaar-2.3.2/), so it unpacks with --strip-components=1 like the
# other GitHub-archive recipes here.
#
# 2.3.2 is the newest tag upstream has, and it is what ffmpeg-kit's own build
# pins (scripts/source.sh: SOURCE_ID="v2.3.2"). It is built here with CMake, the
# build system this tree uses for it; ffmpeg-kit patches kvazaar's autotools
# configure instead (scripts/android/kvazaar.sh seds -lrt out of it), which is
# unnecessary on the CMake path - this project's CMakeLists links Threads but
# never -lrt.
version = "2.3.2"

build = """
mkdir -p dl
if [ ! -f dl/kvazaar.tar.gz ]; then
  curl -fSL -C - -o dl/kvazaar.tar.gz "https://github.com/ultravideo/kvazaar/archive/refs/tags/v2.3.2.tar.gz"
fi
rm -rf src
mkdir -p src
tar -xzf dl/kvazaar.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
